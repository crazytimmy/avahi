name: Rebuild Image on Alpine Update

on:
  schedule:
    # Run every Monday at 00:00
    - cron: '0 0 * * 1' 
  workflow_dispatch: # Allows manual triggering

jobs:
  update_image:
    name: Update image if alpine updated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: auto-update-alpine

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: alpine:latest

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Print Alpine image version
        run: |
          echo "The latest tag is ${{ steps.meta.outputs.tags }}"
          echo "The latest labels are ${{ steps.meta.outputs.labels }}"
